<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the value of `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evolution · a live drop of pond water</title>
  <meta name="description" content="Watch natural selection happen under a microscope. Microbes hunt algae, divide, mutate and adapt to light, famine and predators. Five guided experiments included.">
  <meta name="theme-color" content="#09080E">
  <meta name="color-scheme" content="dark">

  <!-- Link previews -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Evolution · a live drop of pond water">
  <meta property="og:description" content="Microbes hunt algae, divide, mutate and adapt. Watch natural selection happen live, then run your own experiments.">
  <meta property="og:image" content="https://chams99.github.io/Evolution/social.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://chams99.github.io/Evolution/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Evolution · a live drop of pond water">
  <meta name="twitter:description" content="Watch natural selection happen under a microscope.">
  <meta name="twitter:image" content="https://chams99.github.io/Evolution/social.png">
  <meta name="author" content="Chames Eddine Dhibi">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Evolution">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- The drawing engine and default font come from Google's CDN: connect early. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    html, body { margin: 0; height: 100%; background: #09080E; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; background: #09080E; color: #F5ECE0; transition: opacity 400ms ease;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    .lens {
      position: relative; width: 132px; height: 132px; border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #F4F0E7 0%, #D9D0C1 62%, #6E6457 100%);
      box-shadow: 0 0 0 1px rgba(245, 236, 224, 0.2), 0 0 0 10px #120F14, 0 0 0 11px rgba(245, 236, 224, 0.12);
      overflow: hidden;
    }
    .cell {
      position: absolute; width: 22px; height: 15px; border-radius: 50%;
      border: 1.5px solid rgba(45, 36, 33, 0.7); background: rgba(167, 92, 122, 0.55);
      animation: swim 2.4s ease-in-out infinite;
    }
    .cell::after {
      content: ""; position: absolute; left: 6px; top: 4px; width: 6px; height: 6px; border-radius: 50%;
      background: rgba(45, 36, 33, 0.55);
    }
    .cell.b { left: 64px; top: 40px; background: rgba(59, 125, 177, 0.55); animation-delay: -0.8s; }
    .cell.a { left: 30px; top: 70px; }
    .cell.c { left: 80px; top: 84px; background: rgba(165, 102, 50, 0.55); animation-delay: -1.6s; }
    .alga { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #5E904D; }
    @keyframes swim {
      0%, 100% { transform: translate(0, 0) rotate(-8deg); }
      50% { transform: translate(10px, -6px) rotate(10deg); }
    }
    .label { font-size: 11px; letter-spacing: 0.08em; color: #B8ADA4; text-transform: uppercase; }
    .title { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
    .progress { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .bar { width: 180px; height: 3px; border-radius: 2px; background: #1B161B; overflow: hidden; }
    .fill { height: 100%; background: #C9A453; transform-origin: left; transform: scaleX(0.03); }
    .hint {
      max-width: 260px; text-align: center; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px;
      line-height: 1.45; color: #7A716B; opacity: 0; transition: opacity 600ms ease;
    }
    .hint.shown { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { .cell { animation: none; } }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <div class="lens" aria-hidden="true">
      <span class="alga" style="left:22px;top:30px"></span>
      <span class="alga" style="left:98px;top:58px"></span>
      <span class="alga" style="left:52px;top:104px"></span>
      <span class="cell a"></span><span class="cell b"></span><span class="cell c"></span>
    </div>
    <div class="title">Evolution</div>
    <div class="progress">
      <div class="bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="3">
        <div class="fill"></div>
      </div>
      <div class="label" id="loading-step">Downloading the simulation…</div>
    </div>
    <div class="hint" id="loading-hint">Only the first visit takes this long. After that it opens much faster.</div>
  </div>
  <noscript>
    <p style="color:#F5ECE0;font-family:system-ui;text-align:center;margin-top:40vh">
      Evolution needs JavaScript to run the simulation.
    </p>
  </noscript>
  <script>
    // The microbe figures are needed for the first frame. Fetching them now,
    // alongside the engine, means they are already cached when the app asks.
    ['cell_tint', 'cell_overlay', 'cell_ghost', 'algae'].forEach(function (name) {
      ['', '@half', '@quarter'].forEach(function (size) { fetch('assets/assets/sprites/' + name + size + '.png'); });
    });

    // Start-up runs in three steps (see flutter_bootstrap.js). Within a step
    // the bar eases towards that step's end over time, so it keeps moving
    // without ever claiming more than has actually happened.
    (function () {
      var steps = [
        { label: 'Downloading the simulation…', end: 0.7, seconds: 4 },
        { label: 'Starting the microscope…', end: 0.9, seconds: 1.5 },
        { label: 'Placing the microbes…', end: 0.98, seconds: 0.5 },
      ];
      var root = document.getElementById('loading');
      var bar = root.querySelector('.bar');
      var fill = root.querySelector('.fill');
      var label = document.getElementById('loading-step');
      var step = 0, from = 0.03, since = performance.now(), running = true;
      function shown() {
        var s = steps[step], t = (performance.now() - since) / 1000;
        return from + (s.end - from) * (1 - Math.exp(-t / s.seconds));
      }
      function frame() {
        fill.style.transform = 'scaleX(' + shown().toFixed(4) + ')';
        if (running) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
      window.evolutionLoading = function (next) {
        from = Math.max(shown(), steps[next - 1].end);
        since = performance.now();
        step = next;
        label.textContent = steps[next].label;
        bar.setAttribute('aria-valuenow', Math.round(from * 100));
      };
      var slow = setTimeout(function () { document.getElementById('loading-hint').classList.add('shown'); }, 6000);
      window.addEventListener('flutter-first-frame', function () {
        running = false;
        clearTimeout(slow);
        fill.style.transition = 'transform 200ms ease';
        fill.style.transform = 'scaleX(1)';
        root.classList.add('done');
        setTimeout(function () { root.remove(); }, 500);
      });
    })();
  </script>
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
